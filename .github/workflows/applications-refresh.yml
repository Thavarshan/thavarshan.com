name: Refresh Application Packages

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional normalized job snapshot ID (20 hexadecimal characters)"
        type: string
        required: false
      mode:
        description: "Groq Free AI or explicit deterministic template recovery"
        type: choice
        default: ai
        options:
          - template
          - ai

permissions:
  contents: read

concurrency:
  group: applications-refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Stay on Groq Free. Never enable billing or route to a paid fallback.
      APPLICATIONS_JOB_ID: ${{ inputs.job_id }}
      APPLICATIONS_MODE: ${{ inputs.mode || 'ai' }}
      APPLICATIONS_AUTOMATION_ENABLED: ${{ vars.APPLICATIONS_AUTOMATION_ENABLED || 'true' }}
      GROQ_FREE_PLAN_CONFIRMED: ${{ vars.GROQ_FREE_PLAN_CONFIRMED }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      APPLICATIONS_REPO_DEPLOY_KEY: ${{ secrets.APPLICATIONS_REPO_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate tailored application packages
        run: npm run applications:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- application- groq- hallucination cover-letter latex-tailoring
