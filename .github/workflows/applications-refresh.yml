name: Refresh Application Packages

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional normalized job snapshot ID (20 hexadecimal characters)"
        type: string
        required: false
      mode:
        description: "Template is free; AI requires explicit spending opt-in"
        type: choice
        default: template
        options:
          - template
          - ai

permissions:
  contents: read

concurrency:
  group: applications-refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The OpenAI API is pay-per-use. It only runs when ENABLE_PAID_AI=true (a repository variable) is
      # set on purpose; having the key configured is not enough. See docs/cost-policy.md.
      APPLICATIONS_JOB_ID: ${{ inputs.job_id }}
      APPLICATIONS_MODE: ${{ inputs.mode || 'template' }}
      ENABLE_PAID_AI: ${{ vars.ENABLE_PAID_AI }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APPLICATIONS_REPO_DEPLOY_KEY: ${{ secrets.APPLICATIONS_REPO_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate tailored application packages
        if: env.APPLICATIONS_REPO_DEPLOY_KEY != '' || github.event_name == 'workflow_dispatch'
        run: npm run applications:generate
      - name: Secrets not configured
        if: env.APPLICATIONS_REPO_DEPLOY_KEY == '' && github.event_name != 'workflow_dispatch'
        run: echo "Private repository deploy key is not configured; skipping scheduled preparation."
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- application- hallucination cover-letter latex-tailoring
