name: Refresh Application Packages

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applications-refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The OpenAI API is pay-per-use. It only runs when ENABLE_PAID_AI=true (a repository variable) is
      # set on purpose; having the key configured is not enough. See docs/cost-policy.md.
      ENABLE_PAID_AI: ${{ vars.ENABLE_PAID_AI }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APPLICATIONS_REPO_DEPLOY_KEY: ${{ secrets.APPLICATIONS_REPO_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate tailored application packages
        if: env.ENABLE_PAID_AI == 'true' && env.OPENAI_API_KEY != '' && env.APPLICATIONS_REPO_DEPLOY_KEY != ''
        run: npm run applications:generate
      - name: Secrets not configured
        if: env.ENABLE_PAID_AI != 'true' || env.OPENAI_API_KEY == '' || env.APPLICATIONS_REPO_DEPLOY_KEY == ''
        run: echo "Paid AI generation is off (ENABLE_PAID_AI != true) or its secrets are not set; skipping, no cost incurred."
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- application- hallucination cover-letter latex-tailoring
