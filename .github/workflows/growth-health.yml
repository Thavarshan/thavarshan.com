name: Growth Engine Health

on:
  schedule:
    # After the Monday profile, jobs, application and metrics schedules; 11:15 Asia/Colombo.
    - cron: "45 5 * * 1"
  workflow_dispatch:
    inputs:
      notify:
        description: "Publish the report to the email notification thread"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "automation/growth/health/**"
      - "automation/growth/search/**"
      - "automation/marketing/content-review.ts"
      - "marketing/content-review-state.json"
      - "marketing/search-positioning.json"
      - ".github/workflows/growth-health.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: automated-generated-content
  cancel-in-progress: false

jobs:
  search-feedback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare private search feedback
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ vars.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
          APPLICATIONS_REPO_DEPLOY_KEY: ${{ secrets.APPLICATIONS_REPO_DEPLOY_KEY }}
          APPLICATIONS_REPO_SLUG: ${{ vars.APPLICATIONS_REPO_SLUG }}
        run: npm run growth:search
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: search-feedback-status
          path: test-results/search-status/status.json
          retention-days: 1
          if-no-files-found: error

  report:
    needs: search-feedback
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      baseline_written: ${{ steps.health.outputs.baseline_written }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        continue-on-error: true
        with:
          name: search-feedback-status
          path: test-results/search-status/
      - name: Build public operational report
        id: health
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run growth:health -- --write-baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: growth-health-report
          path: test-results/growth-health/
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.health.outputs.baseline_written == 'true'
        with:
          name: growth-health-baseline
          path: data/growth-health/baseline.json
          retention-days: 1

  propose-baseline:
    needs: report
    if: needs.report.outputs.baseline_written == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: growth-health-baseline
          path: data/growth-health/
      - name: Propose validated public comparison baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash automation/ci/publish-generated.sh growth-health "Record Growth Engine comparison baseline" data/growth-health/baseline.json

  notify:
    needs: report
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.notify)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: growth-health-report
          path: test-results/growth-health/
      - name: Publish report for GitHub email delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run growth:notify
