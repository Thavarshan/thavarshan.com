name: Refresh Laravel Jobs

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: automated-generated-content
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Collect
        id: collect
        # Bounded well inside the job timeout; each source also has its own deadline in the collector.
        timeout-minutes: 12
        run: npm run jobs:collect
      - run: npm run jobs:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- job-
      - run: npm run build
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jobs-collector-diagnostics
          path: .jobs-diagnostics/
          if-no-files-found: ignore
      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet -- data/jobs.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Generated changes are proposed as a PR; the helper explicitly dispatches required CI.
      - name: Propose generated jobs updates for review
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash automation/ci/publish-generated.sh jobs "Refresh Laravel job opportunities" data/jobs.generated.json
      - name: No generated changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No Laravel job opportunity changes detected."
      # A degraded run still publishes the sources that succeeded (failed sources' data is carried
      # forward untouched); failing here, after the commit, makes the problem visible without
      # discarding a day of fresh data from the healthy sources.
      - name: Fail the run if any source failed
        if: steps.collect.outputs.degraded == 'true'
        run: |
          echo "::error::One or more job sources failed; healthy sources were still published. See the job summary and the jobs-collector-diagnostics artifact."
          exit 1
