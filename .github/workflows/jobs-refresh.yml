name: Refresh Laravel Jobs

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: automated-generated-content
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Collect
        id: collect
        # Bounded well inside the job timeout; each source also has its own deadline in the collector.
        timeout-minutes: 12
        run: npm run jobs:collect
      - run: npm run jobs:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- job-
      - run: npm run build
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jobs-collector-diagnostics
          path: .jobs-diagnostics/
          if-no-files-found: ignore
      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet -- data/jobs.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Generated changes are proposed as a PR; the helper explicitly dispatches required CI.
      - name: Propose generated jobs updates for review
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash automation/ci/publish-generated.sh jobs "Refresh Laravel job opportunities" data/jobs.generated.json
      - name: No generated changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No Laravel job opportunity changes detected."
      # Failed sources' data is carried forward. Report degradation after proposing the healthy
      # updates for review; required PR CI still validates the resulting snapshot.
      - name: Fail the run if any source failed
        if: steps.collect.outputs.degraded == 'true'
        run: |
          echo "::error::One or more job sources failed; generated updates are proposed through reviewable PRs. See the job summary and the jobs-collector-diagnostics artifact."
          exit 1
