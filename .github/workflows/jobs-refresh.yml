name: Refresh Laravel Jobs

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-generated-content
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Collect
        id: collect
        # Bounded well inside the job timeout; each source also has its own deadline in the collector.
        timeout-minutes: 12
        run: npm run jobs:collect
      - run: npm run jobs:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- job-
      - run: npm run build
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-collector-diagnostics
          path: .jobs-diagnostics/
          if-no-files-found: ignore
      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet -- data/jobs.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, and this workflow has no push
      # trigger, so a generated commit can never re-trigger the collector.
      - name: Commit generated jobs directly to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.generated.json
          git commit -m "Refresh Laravel job opportunities"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: No generated changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No Laravel job opportunity changes detected."
      # A degraded run still publishes the sources that succeeded (failed sources' data is carried
      # forward untouched); failing here, after the commit, makes the problem visible without
      # discarding a day of fresh data from the healthy sources.
      - name: Fail the run if any source failed
        if: steps.collect.outputs.degraded == 'true'
        run: |
          echo "::error::One or more job sources failed; healthy sources were still published. See the job summary and the jobs-collector-diagnostics artifact."
          exit 1
