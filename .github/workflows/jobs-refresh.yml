name: Refresh Laravel Jobs

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-generated-content
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run jobs:collect
      - run: npm run typecheck
      - run: npm run test -- tests/unit/job-opportunities.test.ts
      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet -- data/jobs.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit generated jobs directly to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.generated.json
          git commit -m "Refresh Laravel job opportunities"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: No generated changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No Laravel job opportunity changes detected."
