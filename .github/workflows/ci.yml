name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push event's `before` SHA can precede many commits; fetch complete history
          # so lifecycle checks always compare against the actual pre-push revision.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Formatting (Prettier)
        run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run jobs:validate
      - run: npm run insights:bundle
      - run: npm run audit
      - run: npm run build
        env:
          COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CONTEXT: ${{ github.ref == 'refs/heads/main' && 'production' || 'deploy-preview' }}
      - run: npm run site:deploy:check
      - name: Public URL inventory is unchanged
        run: npm run structure:routes
      - name: Concrete URLs and redirect lifecycle
        run: npm run seo:lifecycle
        env:
          LIFECYCLE_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standard-static-build
          path: out/
          retention-days: 1
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 1

  seo:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standard-static-build
          path: out
      - run: npm run seo:audit
        env:
          CI_PREBUILT: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rendered-seo-audit
          path: test-results/seo/audit.json
          retention-days: 1

  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cv:publish
      - name: Verify free application PDFs without private credentials
        run: node --import tsx automation/applications/verify-template.ts
      - run: git diff --exit-code -- cv/generated/Jerome-Resume.tex public/docs/Jerome-Resume.pdf public/docs/Jerome-Resume-fallback.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: professional-cv-preview
          path: |
            public/docs/Jerome-Resume.pdf
            public/docs/Jerome-Resume-fallback.pdf
          retention-days: 1

  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standard-static-build
          path: out
      - run: |
          npm start -- --hostname 127.0.0.1 --port 3000 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 1

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash automation/ci/security.sh

  ci-gate:
    if: ${{ always() }}
    needs: [quality, browser, seo, cv, lighthouse, security]
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Require every mandatory job to succeed
        id: gate
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        # Plain Node: this gate must run even when dependency installation failed.
        run: node automation/ci/gate.mjs
      - name: Record dispatched CI gate for branch protection
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          GATE_RESULT: ${{ steps.gate.outcome }}
        run: node automation/ci/gate-status.mjs

  deploy:
    name: Deploy to Cloudflare
    permissions:
      contents: read
      deployments: write
    environment:
      name: Production
      url: https://thavarshan.com
    needs: ci-gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production export
        run: npm run build
        env:
          CONTEXT: production
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
      - name: Deploy public site and www redirect
        run: npm run site:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production revision, headers, redirects and PDF
        run: npm run deployment:smoke
        env:
          EXPECTED_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cloudflare-production-smoke
          path: test-results/deployment/audit.json
          retention-days: 7
