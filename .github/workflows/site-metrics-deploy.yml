name: Deploy Site Metrics Worker

# Deploys the first-party, cookie-free event collector (docs/measurement.md) on the Workers FREE plan.
# No-op until the Cloudflare secrets exist.

on:
  push:
    branches: [main]
    paths:
      - "workers/site-metrics/**"
      - "lib/telemetry/events.ts"
      - "lib/edge/**"
      - "package-lock.json"
      - ".github/workflows/site-metrics-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-metrics-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not configured; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.enabled == 'true'
      - name: Verify before deploying
        if: steps.creds.outputs.enabled == 'true'
        run: |
          npm run typecheck
          npx vitest run tests/unit/site-metrics tests/unit/telemetry tests/unit/worker-cost-guard
      - name: Deploy Worker
        if: steps.creds.outputs.enabled == 'true'
        run: npx wrangler deploy --config workers/site-metrics/wrangler.toml --var "WORKER_VERSION:${GITHUB_SHA::7}"
