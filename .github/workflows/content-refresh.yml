name: Content Refresh

on:
  push:
    branches: [main]
    paths:
      - "data/profile.generated.json"
      - "data/github.generated.json"
      - "data/package-registry.generated.json"
      - "public/docs/Jerome-Resume.pdf"
      - "lib/latex.ts"
      - "cv/**"
      - "scripts/cv/**"
      - "scripts/profile/github.ts"
      - "scripts/marketing/registry.ts"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-generated-content
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh public snapshots
        run: |
          npm run profile:github
          npm run registry:sync
      - run: npm run cv:publish
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run insights:bundle
      - run: npm run build
      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet -- data/github.generated.json data/package-registry.generated.json cv/generated/Jerome-Resume.tex public/docs/Jerome-Resume.pdf; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit generated content directly to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.generated.json data/package-registry.generated.json cv/generated/Jerome-Resume.tex public/docs/Jerome-Resume.pdf
          git commit -m "Refresh public profile content"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: No generated changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No generated snapshot changes detected."

  publish-cv:
    needs: refresh
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
      BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cv:verify -- public/docs/Jerome-Resume.pdf
      - name: Publish stable CV release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view cv-latest >/dev/null 2>&1 || gh release create cv-latest --title "Latest professional CV" --notes "Automatically generated from the validated professional profile and current GitHub metadata." --latest=false
          gh release upload cv-latest public/docs/Jerome-Resume.pdf --clobber
      - name: Trigger Netlify refresh
        if: ${{ env.NETLIFY_BUILD_HOOK != '' }}
        run: curl --fail --silent --show-error --request POST --data '{}' "$NETLIFY_BUILD_HOOK"
      - name: Submit URLs to IndexNow
        if: ${{ env.BING_INDEXNOW_KEY != '' }}
        run: npm run seo:indexnow
