name: Deploy Job Review Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/job-review/**"
      - "lib/job-review.ts"
      - "lib/job-opportunities.ts"
      - "lib/job-eligibility-signals.ts"
      - "package-lock.json"
      - ".github/workflows/job-review-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-review-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not configured; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.enabled == 'true'
      - name: Verify before deploying
        if: steps.creds.outputs.enabled == 'true'
        run: |
          npm run typecheck
          npx vitest run tests/unit/job-review tests/unit/job-scoring
      - name: Deploy Worker
        if: steps.creds.outputs.enabled == 'true'
        env:
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ALLOWED_EMAIL: ${{ vars.ALLOWED_EMAIL }}
        run: |
          # Access settings are non-secret repository variables; --keep-vars preserves any set in the dashboard.
          args=(--config workers/job-review/wrangler.toml --keep-vars)
          [ -n "$ACCESS_TEAM_DOMAIN" ] && args+=(--var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN")
          [ -n "$ACCESS_AUD" ] && args+=(--var "ACCESS_AUD:$ACCESS_AUD")
          [ -n "$ALLOWED_EMAIL" ] && args+=(--var "ALLOWED_EMAIL:$ALLOWED_EMAIL")
          npx wrangler deploy "${args[@]}"
