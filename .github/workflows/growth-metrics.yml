name: Growth Metrics Snapshot

# Reads the first-party collector's daily aggregate counters from Cloudflare KV and commits a weekly
# aggregate snapshot to data/growth/. Aggregates only: there is no visitor-level data anywhere.
# Free: GitHub Actions (public repo) + the Cloudflare Free plan. No-op until the Cloudflare secrets exist.

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      start:
        description: "Optional period start (YYYY-MM-DD); defaults to the last completed ISO week"
        required: false
      end:
        description: "Optional period end (YYYY-MM-DD); use together with start"
        required: false
      dry_run:
        description: "Print the snapshot but write and commit nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: automated-generated-content
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the generator
        run: |
          npm run typecheck
          npx vitest run tests/unit/telemetry
      - name: Build the snapshot
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [ -n "$START" ] && args+=(--start "$START")
          [ -n "$END" ] && args+=(--end "$END")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          npm run growth:metrics -- "${args[@]}"
      - name: Detect generated changes
        id: changes
        run: |
          if git status --porcelain -- data/growth | grep -q .; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Propose growth snapshot for review
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash automation/ci/publish-generated.sh growth "Add weekly growth metrics snapshot" data/growth
      - name: Nothing to commit
        if: steps.changes.outputs.changed == 'false'
        run: echo "No snapshot written (dry run, or Cloudflare secrets not configured)."
