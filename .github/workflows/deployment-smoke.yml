name: Deployment Smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Optional HTTPS preview origin for thavarshan-site on workers.dev"
        type: string
        required: false
      revision:
        description: "Full deployed commit SHA (required for a preview; production uses main)"
        type: string
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: site-preview-${{ github.event.workflow_run.pull_requests[0].number || inputs.preview_url || github.event.workflow_run.head_branch || 'production' }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (((github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main') || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null) || (github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'automation/generated-'))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only trusted main executes. Preview artifacts contain static files, never executable CI code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve trusted preview
        id: preview
        env:
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$TRIGGER_EVENT" = workflow_dispatch ] && [[ "$TRIGGER_BRANCH" == automation/generated-* ]]; then
            TRIGGER_PR="$(gh pr list --head "$TRIGGER_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
            if [ -z "$TRIGGER_PR" ]; then echo "Generated branch has no open pull request"; exit 1; fi
            TRIGGER_EVENT=pull_request
          fi
          if [ "$TRIGGER_EVENT" = pull_request ]; then
            [[ "$TRIGGER_PR" =~ ^[0-9]+$ ]] || exit 1
            head_repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TRIGGER_PR" --jq '.head.repo.full_name')"
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then echo "Fork previews cannot access deployment credentials"; exit 1; fi
            state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TRIGGER_PR" --jq '.state')"
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TRIGGER_PR" --jq '.head.sha')"
            if [ "$state" != open ] || [ "$current_sha" != "$TRIGGER_SHA" ]; then
              echo "Preview was closed or superseded; skipping publication."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "name=thavarshan-site-pr-$TRIGGER_PR" >> "$GITHUB_OUTPUT"
          fi
      - name: Download checked static preview
        if: steps.preview.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standard-static-build
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy isolated static preview
        if: steps.preview.outputs.enabled == 'true'
        env:
          PREVIEW_NAME: ${{ steps.preview.outputs.name }}
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("out/build-info.json")); if(m.revision!==process.env.EXPECTED_REVISION || m.context!=="deploy-preview") process.exit(1);'
          npx wrangler deploy --config wrangler.json --env preview --name "$PREVIEW_NAME"
      - name: Verify published deployment
        if: steps.preview.outputs.skip != 'true'
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          PREVIEW_REVISION: ${{ inputs.revision }}
          PREVIEW_NAME: ${{ steps.preview.outputs.name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          export EXPECTED_REVISION="$(git rev-parse HEAD)"
          if [ -n "$PREVIEW_NAME" ]; then
            PREVIEW_URL="https://$PREVIEW_NAME.tjthavarshan.workers.dev"
            PREVIEW_REVISION="$TRIGGER_SHA"
          fi
          if [ -n "$PREVIEW_URL" ]; then
            export DEPLOYMENT_MODE=preview
            export DEPLOYMENT_URL="$PREVIEW_URL"
            export EXPECTED_REVISION="$PREVIEW_REVISION"
          fi
          npm run deployment:smoke
          if [ "${DEPLOYMENT_MODE:-production}" = production ]; then npm run seo:webmaster; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: deployment-smoke-report
          path: |
            test-results/deployment/audit.json
            test-results/webmaster/audit.json
          retention-days: 1
