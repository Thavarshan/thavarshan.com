name: Preview Job Review Worker

# Uploads a NON-PRODUCTION version of the Worker for a pull request and prints its preview URL.
# `wrangler versions upload` never changes what production serves and costs nothing on the Free plan.
# The preview shares the production KV binding, so it runs READ_ONLY (writes are refused in code) and
# is protected by the same Cloudflare Access application (which covers preview URLs).

on:
  pull_request:
    paths:
      - "workers/job-review/**"
      - "src/features/jobs/review.ts"
      - "src/shared/edge/**"
      - "src/features/jobs/opportunities.ts"
      - "src/features/jobs/eligibility-signals.ts"
      - "package-lock.json"
      - ".github/workflows/job-review-preview.yml"

permissions:
  contents: read

concurrency:
  group: job-review-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Secrets are never exposed to forks, and we never run untrusted fork code with the deploy token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not configured; skipping preview."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.enabled == 'true'
      - name: Verify before uploading
        if: steps.creds.outputs.enabled == 'true'
        run: |
          npm run typecheck
          npx vitest run tests/integration/workers tests/unit/jobs
      - name: Upload preview version
        if: steps.creds.outputs.enabled == 'true'
        env:
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(--config workers/job-review/wrangler.toml --preview-alias "pr-${PR_NUMBER}" --var READ_ONLY:1 --var "WORKER_VERSION:${GITHUB_SHA::7}-pr${PR_NUMBER}")
          [ -n "$ACCESS_TEAM_DOMAIN" ] && args+=(--var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN")
          [ -n "$ACCESS_AUD" ] && args+=(--var "ACCESS_AUD:$ACCESS_AUD")
          [ -n "$ALLOWED_EMAIL" ] && args+=(--var "ALLOWED_EMAIL:$ALLOWED_EMAIL")
          npx wrangler versions upload "${args[@]}" | tee upload.log
          { echo "### Job review preview (read-only)"; grep -Eo 'https://[^ ]+workers\.dev[^ ]*' upload.log | sort -u | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
