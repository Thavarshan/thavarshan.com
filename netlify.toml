[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[[headers]]
  for = "/docs/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/indexnow-key.txt"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' mailto:; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://plausible.io; connect-src 'self' https://plausible.io https://site-metrics.tjthavarshan.workers.dev; upgrade-insecure-requests"

# Only this exact alias redirects; deploy-preview and branch hosts remain reachable.
[[redirects]]
  from = "https://thavarshan.netlify.app/*"
  to = "https://thavarshan.com/:splat"
  status = 301
  force = true
